# 라벨링 분류 체계와 평가 설정
#
# classes          : 작업자가 쓸 수 있는 전체 목록. 넉넉하게 선언한다.
#                    인스턴스가 0 인 클래스가 있어도 된다 - 나중에 그런 객체가
#                    나오는 세션을 추가할 때 체계를 바꾸지 않아도 된다.
# evaluation.classes : 실제로 점수를 매길 것. 라벨링 후 인스턴스 수를 세어 정한다.
#                      0 개인 클래스를 넣으면 AP 가 0/0 이 되어 mAP 전체가 망가진다.
#
# 세분화해서 라벨링하고 나중에 합친다. 합치는 것은 공짜지만 나누려면 재라벨링이다.

classes:
  # --- 차량 ---
  car:          {size: [4.5, 1.8, 1.5], max_label_range_m: 20}
  truck:        {size: [5.5, 2.0, 2.2], max_label_range_m: 20}   # 1톤 화물
  van:          {size: [5.0, 1.9, 2.0], max_label_range_m: 20}   # 승합
  bus:          {size: [11.0, 2.5, 3.2], max_label_range_m: 20}
  motorcycle:   {size: [2.1, 0.8, 1.4], max_label_range_m: 20}
  bicycle:      {size: [1.8, 0.6, 1.2], max_label_range_m: 20}

  # --- 사람 ---
  pedestrian:   {size: [0.7, 0.7, 1.7], max_label_range_m: 20}
  # 2026-10-03 기준 8 세션 표본에서 0 명. 선언만 해 둔다 - 표본 밖 프레임에
  # 나타날 수 있고, 그때 작업자가 건너뛰지 않게 하려는 것이다.

  # --- 바닥 설치물 ---
  traffic_cone: {size: [0.45, 0.45, 0.75], fixed_size: true, fixed_yaw: true,
                 max_label_range_m: 10}
  # 주행 유도 꼬깔콘. 규격품이라 크기가 일정하다. session_031 실측 (30 스윕 누적):
  #   꼭대기 0.72 m · 바닥 폭 0.36~0.47 m · 꼭대기 폭 0.24 m · 1.4 m 간격으로 한 줄
  # 10 m 를 넘기면 2 도 간격 탓에 링이 2 개뿐이라 보이지 않는다. 크기·방향을
  # 고정하고 중심 위치만 맞춘다.
  #
  # 2026-10-04: bollard 클래스를 삭제했다. 촬영한 8 세션 어디에도 볼라드가 없다.
  cart:         {size: [1.0, 0.6, 1.0], max_label_range_m: 15}

# 라벨링하지 않는 것 - 구조물이다
not_labeled: [기둥, 벽, 천장 배관, 바닥 표시, 주차 차단기, 반사경, 안내 표지]

attributes:
  vehicle_state: [parked, stopped, moving]   # 주차장이라 대부분 parked
  covered: [true, false]                     # 차량 커버를 씌운 차 (대구공항 세션에 다수)
  visibility: ["0-40", "41-60", "61-80", "81-100"]   # nuScenes 와 동일한 4 단계

evaluation:
  classes: [car, truck, traffic_cone]
  # 라벨링 후 인스턴스 수를 세어 확정한다. van/bus/motorcycle 등은 수가 모이면 추가.

  metric: center_distance
  # 3D IoU 가 아니다. 16 빔이라 30 m 에서 차 한 대에 점이 25 개뿐이고 그 상태의
  # 크기 추정을 IoU 로 벌점하면 가혹하다. nuScenes 가 중심점 거리를 택한 이유와 같다.

  thresholds_m:
    default: [0.5, 1.0, 2.0, 4.0]
    traffic_cone: [0.25, 0.5, 1.0, 2.0]   # 객체가 0.45 m 라 4 m 임계값은 의미가 없다

  max_range_m:
    default: 20
    traffic_cone: 10
  # 처음에는 라벨 40 m / 평가 30 m 로 잡았으나 실제 데이터를 보고 20 m 로 줄였다.
  # 30 m 에서 차 한 대에 점이 25 개뿐이라 세로로 1~2 링만 걸리고, 그러면 방향(yaw)과
  # 높이를 라이다로 정할 수 없다. 20 m 면 55 개로 쓸 만하다.
  #
  # 라벨 범위와 평가 범위를 같게 둔 이유: 정한 범위 안을 빠뜨리면 모델이 그 객체를
  # 맞게 찾아도 정답에 없어 오탐으로 집계된다. 범위를 좁히는 것은 괜찮지만
  # **그 안은 빠짐없이** 라벨링해야 한다.

  min_gt_points: 1          # 점이 0 개인 GT 는 평가에서 제외
  flag_sparse_below: 5      # 5 점 미만은 따로 표시해 난이도 분석에 쓴다
  tp_metrics: [ATE, ASE, AOE]
  # AVE(속도)·AAE(속성) 은 트랙 ID 로 속도를 산출해야 해서 일단 제외.

split:
  status: undecided
  principle: geographic
  # 시간이 아니라 지리적 거리로 나눈다. 같은 주차장을 시간으로 자르면 인접
  # 구간이 train/test 에 걸쳐 누수가 생긴다 (arXiv:2607.00710).
  # 장소가 글로벌플라자·대구공항 둘뿐이라 설계가 필요하다. 16 단계에서 정한다.

odometry:
  # KISS-ICP 설정. 기본값(voxel 1.0 m, max_range 100 m)은 야외 고속주행용이라
  # 실내 저속에서는 지도가 뭉개진다. 아래 값이 드리프트를 32 % 줄였다.
  voxel_size: 0.2
  max_range_m: 25
  deskew: true
  drift_cm:          # 정지 물체가 시간 간격별로 어긋나는 양 (session_025 실측)
    1s: 2.0
    5s: 3.4
    10s: 13.4
    15s: 26.3
  propagate_window_s: 5   # 정적 객체 박스를 이 간격마다 다시 맞춘다

keyframes:
  # 시간이 아니라 이동 거리 기준으로 고른다.
  # nuScenes 는 2 Hz 지만 시속 25~50 km 라 간격이 약 5 m 다. 우리는 시속 4 km 여서
  # 2 Hz 로 뽑으면 0.55 m 간격이 되고 정지 구간이 그대로 중복된다
  # (session_025 의 경우 51 장 중 12 장이 같은 장면).
  rule: distance
  min_dist_m: 1.0        # 직전 키프레임에서 이만큼 움직이면 선택
  max_gap_s: 3.0         # 안 움직여도 이 초가 지나면 선택 (정지 구간도 담기게)
  # session_025: 스캔 251 → 키프레임 28, 평균 간격 1.01 m
