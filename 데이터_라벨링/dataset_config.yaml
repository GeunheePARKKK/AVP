# 라벨링 분류 체계와 평가 설정
#
# classes          : 작업자가 쓸 수 있는 전체 목록. 넉넉하게 선언한다.
#                    인스턴스가 0 인 클래스가 있어도 된다 - 나중에 그런 객체가
#                    나오는 세션을 추가할 때 체계를 바꾸지 않아도 된다.
# evaluation.classes : 실제로 점수를 매길 것. 라벨링 후 인스턴스 수를 세어 정한다.
#                      0 개인 클래스를 넣으면 AP 가 0/0 이 되어 mAP 전체가 망가진다.
#
# 세분화해서 라벨링하고 나중에 합친다. 합치는 것은 공짜지만 나누려면 재라벨링이다.

classes:
  # --- 차량 ---
  car:          {size: [4.5, 1.8, 1.5], max_label_range_m: 40}
  truck:        {size: [5.5, 2.0, 2.2], max_label_range_m: 40}   # 1톤 화물
  van:          {size: [5.0, 1.9, 2.0], max_label_range_m: 40}   # 승합
  bus:          {size: [11.0, 2.5, 3.2], max_label_range_m: 40}
  motorcycle:   {size: [2.1, 0.8, 1.4], max_label_range_m: 25}
  bicycle:      {size: [1.8, 0.6, 1.2], max_label_range_m: 25}

  # --- 사람 ---
  pedestrian:   {size: [0.7, 0.7, 1.7], max_label_range_m: 25}
  # 2026-10-03 기준 8 세션 표본에서 0 명. 선언만 해 둔다 - 표본 밖 프레임에
  # 나타날 수 있고, 그때 작업자가 건너뛰지 않게 하려는 것이다.

  # --- 바닥 설치물 ---
  bollard:      {size: [0.1, 0.1, 0.7], fixed_size: true, fixed_yaw: true,
                 max_label_range_m: 10}
  # 탄력 볼라드. 규격품이라 크기가 일정하다. 20 m 에서 점이 1~2 개뿐이라
  # 크기와 방향을 라이다로 정할 수 없다. 크기·방향을 고정하고 중심 위치만 맞춘다.
  traffic_cone: {size: [0.3, 0.3, 0.7], fixed_size: true, fixed_yaw: true,
                 max_label_range_m: 10}
  cart:         {size: [1.0, 0.6, 1.0], max_label_range_m: 15}

# 라벨링하지 않는 것 - 구조물이다
not_labeled: [기둥, 벽, 천장 배관, 바닥 표시, 주차 차단기, 반사경, 안내 표지]

attributes:
  vehicle_state: [parked, stopped, moving]   # 주차장이라 대부분 parked
  covered: [true, false]                     # 차량 커버를 씌운 차 (대구공항 세션에 다수)
  visibility: ["0-40", "41-60", "61-80", "81-100"]   # nuScenes 와 동일한 4 단계

evaluation:
  classes: [car, truck, bollard]
  # 라벨링 후 인스턴스 수를 세어 확정한다. van/bus/motorcycle 등은 수가 모이면 추가.

  metric: center_distance
  # 3D IoU 가 아니다. 16 빔이라 30 m 에서 차 한 대에 점이 25 개뿐이고 그 상태의
  # 크기 추정을 IoU 로 벌점하면 가혹하다. nuScenes 가 중심점 거리를 택한 이유와 같다.

  thresholds_m:
    default: [0.5, 1.0, 2.0, 4.0]
    bollard: [0.25, 0.5, 1.0, 2.0]   # 객체가 0.1 m 라 4 m 임계값은 의미가 없다

  max_range_m:
    default: 30
    bollard: 10
  # 30 m 를 넘으면 차에 세로 1~2 링만 걸려 방향·높이를 신뢰할 수 없다.
  # 라벨은 40 m 까지 남기되 평가에서 제외한다.

  min_gt_points: 1          # 점이 0 개인 GT 는 평가에서 제외
  flag_sparse_below: 5      # 5 점 미만은 따로 표시해 난이도 분석에 쓴다
  tp_metrics: [ATE, ASE, AOE]
  # AVE(속도)·AAE(속성) 은 트랙 ID 로 속도를 산출해야 해서 일단 제외.

split:
  status: undecided
  principle: geographic
  # 시간이 아니라 지리적 거리로 나눈다. 같은 주차장을 시간으로 자르면 인접
  # 구간이 train/test 에 걸쳐 누수가 생긴다 (arXiv:2607.00710).
  # 장소가 글로벌플라자·대구공항 둘뿐이라 설계가 필요하다. 16 단계에서 정한다.
