# ArUco 4개 + 원형 구멍 3개 보드 정의
#
# 좌표계: 보드 중심이 원점, +x 오른쪽, +y 위, +z 보드 앞면 법선
# marker_positions 는 각 마커의 '좌상단 코너' 위치(m)
#
# 실측 기준 (2026-09-23, 줄자)
#   A = 가로 전체폭 790 mm  (좌상 마커 바깥 왼쪽 끝 ~ 우상 마커 바깥 오른쪽 끝)
#   B = 세로 전체높이 530 mm (좌상 마커 바깥 위쪽 끝 ~ 좌하 마커 바깥 아래쪽 끝)
#   마커 한 변 150 mm
#
# 검증: 마커별 독립 자세추정으로 중심간 거리 측정 -> 가로 643/645, 세로 383/380,
#       대각 748/749 mm (기대 640/380/744). 네 마커 평면 적합 잔차 2.5 mm.
#
# 주의: multisensor_calibration 의 TargetWithCirclesAndAruco.yaml 은
#       marker id 를 100~103 으로, 전체폭을 780x520 으로 적고 있으나 둘 다 실제와 다름.

dictionary: DICT_4X4_250
marker_size: 0.150

# id: [좌상단 코너 x, 좌상단 코너 y]
marker_positions:
  0: [-0.395,  0.265]   # 좌상 (top-left)
  1: [ 0.245,  0.265]   # 우상 (top-right)
  2: [-0.395, -0.115]   # 좌하 (bottom-left)
  3: [ 0.245, -0.115]   # 우하 (bottom-right)

# 최소 몇 개가 보여야 자세를 풀 것인가 (3개 이상 권장, 2개는 정확도 급락)
min_markers: 3

# 물리 패널 크기 (라이다 점 잘라내기용. 정밀할 필요 없음)
board_width: 0.915
board_height: 0.610

# 원형 구멍 (평면 매칭에는 쓰지 않음, 참고용)
# [중심x, 중심y, 반지름]
circles:
  - [ 0.000,  0.100, 0.080]
  - [-0.130, -0.070, 0.080]
  - [ 0.140, -0.070, 0.080]
